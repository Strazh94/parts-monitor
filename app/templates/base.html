<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Parts Monitoring{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<nav class="bg-slate-800 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4">
        <div class="flex items-center space-x-1 h-12 overflow-x-auto">
            <a href="/" class="px-3 py-2 rounded hover:bg-slate-700 whitespace-nowrap font-semibold">Dashboard</a>
            <a href="/products" class="px-3 py-2 rounded hover:bg-slate-700 whitespace-nowrap">Products</a>
            <a href="/competitors" class="px-3 py-2 rounded hover:bg-slate-700 whitespace-nowrap">Competitors</a>
            <a href="/analytics" class="px-3 py-2 rounded hover:bg-slate-700 whitespace-nowrap">Analytics</a>
            <a href="/analytics/top" class="px-3 py-2 rounded hover:bg-slate-700 whitespace-nowrap">Top sales</a>
            <a href="/analytics/purchase" class="px-3 py-2 rounded hover:bg-slate-700 whitespace-nowrap">Purchase recommendations</a>
            <a href="/analytics/prices" class="px-3 py-2 rounded hover:bg-slate-700 whitespace-nowrap">Price history</a>
            <a href="/report" class="px-3 py-2 rounded hover:bg-slate-700 whitespace-nowrap">Report</a>
            <a href="/runs" class="px-3 py-2 rounded hover:bg-slate-700 whitespace-nowrap">Runs</a>
            <a href="/settings" class="px-3 py-2 rounded hover:bg-slate-700 whitespace-nowrap">Settings</a>
            <a href="/export/excel" class="ml-auto px-3 py-2 rounded bg-emerald-600 hover:bg-emerald-500 whitespace-nowrap">Excel export</a>
        </div>
    </div>
</nav>
<main class="max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
</main>
</body>
</html>
